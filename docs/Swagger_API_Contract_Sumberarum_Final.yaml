openapi: 3.0.3
info:
  title: Sistem Pengelolaan Sampah Dusun Sumberarum - API Contract
  version: 1.0.0
  description: |-
    **Role:** `admin`, `super_admin` (memerlukan Bearer token), dan Publik (warga, tanpa token).

    **Format response:** seluruh response dibungkus `{status, message, data}`; list disertai `meta` pagination.
servers:
- url: http://127.0.0.1:8000/api
  description: Local Development
tags:
- name: 01 - Authentication
  description: Login, logout, dan akun yang sedang login.
- name: 02 - Public Dashboard
  description: Statistik publik yang ditampilkan kepada warga tanpa autentikasi. Dokumentasi kegiatan (section transparansi
    proses) bersifat statis dan ditulis langsung pada frontend, sehingga tidak memiliki endpoint.
- name: 03 - Admin Dashboard
  description: Ringkasan operasional dan informasi yang membutuhkan tindakan Admin.
- name: 04 - Kumpul Sampah
  description: Pencatatan setoran, detail sampah, dan penimbangan.
- name: 05 - Status Setoran
  description: Daftar, detail, dan status setoran sampah (belum_dipilah, menunggu_bayar, selesai).
- name: 06 - Pembayaran & Nota
  description: Nota setoran, pelunasan, dan riwayat pembayaran.
- name: 07 - Data Warga
  description: Master data warga dan nomor WhatsApp.
- name: 08 - Tarif Jasa
  description: Jenis sampah beserta tarif jasa pengelolaan per jenis. Nilai transaksi disimpan pada saat transaksi terjadi,
    sedangkan riwayat perubahan tarif ditelusuri melalui Log Aktivitas.
- name: 09 - Olah Sampah
  description: Batch pengolahan, material yang digunakan, dan status proses.
- name: 10 - PIC Pengolahan
  description: Master data PIC pengolahan.
- name: 11 - Hasil Olahan
  description: Hasil aktual, jumlah, dan nilai hasil olahan.
- name: 12 - Data Pengolahan
  description: Jenis pengolahan (produk hasil olahan), satuannya, dan komposisi bahan baku.
- name: 13 - Pengaturan Operasional
  description: Status operasional buka/tutup.
- name: 14 - Admin & Audit
  description: Pengelolaan akun Admin dan histori perubahan data (khusus Super Admin).
paths:
  /auth/login:
    post:
      tags:
      - 01 - Authentication
      summary: Login
      operationId: login
      description: |-
        **Role:** Publik

        Autentikasi Admin atau Super Admin menggunakan username dan password.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Login berhasil
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/ApiResponse'
                - type: object
                  properties:
                    data:
                      $ref: '#/components/schemas/LoginData'
        '422':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
      security: []
  /auth/logout:
    post:
      tags:
      - 01 - Authentication
      summary: Logout
      operationId: logout
      description: |-
        **Role:** Admin, Super Admin

        Mengakhiri sesi login dan menonaktifkan token yang sedang dipakai.
      responses:
        '200':
          description: Logout berhasil
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/ApiResponse'
                - type: object
                  properties:
                    data:
                      type: object
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /auth/me:
    get:
      tags:
      - 01 - Authentication
      summary: Akun yang sedang login
      operationId: getMe
      description: |-
        **Role:** Admin, Super Admin

        Mengambil data akun (id, nama, username, role) dari token yang dipakai.
      responses:
        '200':
          description: Berhasil
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/ApiResponse'
                - type: object
                  properties:
                    data:
                      $ref: '#/components/schemas/AdminSummary'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /auth/me/password:
    patch:
      tags:
      - 01 - Authentication
      summary: Ubah password sendiri
      operationId: changeMyPassword
      description: |-
        **Role:** Admin, Super Admin

        Mengubah password akun yang sedang login. Memerlukan password lama sebagai verifikasi.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangePasswordRequest'
      responses:
        '200':
          description: Password berhasil diubah
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/ApiResponse'
                - type: object
                  properties:
                    data:
                      type: object
        '422':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /public/status-operasional:
    get:
      tags:
      - 02 - Public Dashboard
      summary: Status operasional (publik)
      operationId: publicStatusOperasional
      description: |-
        **Role:** Publik

        Status buka/tutup tempat pengelolaan sampah untuk landing page warga.
      responses:
        '200':
          description: Berhasil
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/ApiResponse'
                - type: object
                  properties:
                    data:
                      $ref: '#/components/schemas/StatusOperasional'
      security: []
  /public/ringkasan:
    get:
      tags:
      - 02 - Public Dashboard
      summary: Ringkasan pengelolaan sampah
      operationId: publicRingkasan
      description: |-
        **Role:** Publik

        Ringkasan agregat: sampah terkumpul, sampah diolah, hasil olahan yang sudah terbit, dan biaya jasa sampah pada periode terpilih.
      parameters:
      - name: periode
        in: query
        required: false
        description: Periode agregasi data
        schema:
          type: string
          enum:
          - hari
          - minggu
          - bulan
          default: hari
      responses:
        '200':
          description: Berhasil
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/ApiResponse'
                - type: object
                  properties:
                    data:
                      $ref: '#/components/schemas/PublicRingkasan'
      security: []
  /public/perkembangan:
    get:
      tags:
      - 02 - Public Dashboard
      summary: Grafik perkembangan sampah
      operationId: publicPerkembangan
      description: |-
        **Role:** Publik

        Data deret waktu untuk grafik perkembangan sampah terkumpul dan diolah.
      parameters:
      - name: periode
        in: query
        required: false
        description: Periode agregasi data
        schema:
          type: string
          enum:
          - hari
          - minggu
          - bulan
          default: hari
      responses:
        '200':
          description: Berhasil
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/ApiResponse'
                - type: object
                  properties:
                    data:
                      type: array
                      items:
                        $ref: '#/components/schemas/TitikPerkembangan'
      security: []
  /dashboard:
    get:
      tags:
      - 03 - Admin Dashboard
      summary: Ringkasan dashboard admin
      operationId: getAdminDashboard
      description: |-
        **Role:** Admin, Super Admin

        Status operasional, ringkasan sampah terkumpul, nilai sampah terkumpul, ringkasan hasil olahan, batch sedang diolah, dan daftar yang membutuhkan tindakan Admin.
      parameters:
      - name: periode
        in: query
        required: false
        description: Periode agregasi data
        schema:
          type: string
          enum:
          - hari
          - minggu
          - bulan
          default: hari
      responses:
        '200':
          description: Berhasil
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/ApiResponse'
                - type: object
                  properties:
                    data:
                      $ref: '#/components/schemas/AdminDashboard'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /pengumpulan-sampah:
    post:
      tags:
      - 04 - Kumpul Sampah
      summary: Buat setoran baru (nota antrian)
      operationId: createPengumpulan
      description: |-
        **Role:** Admin, Super Admin

        Membuat nota antrian untuk satu warga. Nomor WhatsApp mengikuti data master warga. Sistem menghasilkan ID setoran dengan status awal `belum_dipilah`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PengumpulanCreate'
      responses:
        '201':
          description: Setoran dibuat
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/ApiResponse'
                - type: object
                  properties:
                    data:
                      $ref: '#/components/schemas/PengumpulanRingkas'
        '422':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    get:
      tags:
      - 05 - Status Setoran
      summary: Daftar setoran
      operationId: listPengumpulan
      description: |-
        **Role:** Admin, Super Admin

        Daftar setoran dengan filter status: Menunggu Pilah (`belum_dipilah`), Menunggu Bayar (`menunggu_bayar`), Selesai (`selesai`), atau Semua (tanpa filter status).
      parameters:
      - name: status
        in: query
        required: false
        description: Filter status setoran
        schema:
          type: string
          enum:
          - belum_dipilah
          - menunggu_bayar
          - selesai
      - name: tanggal
        in: query
        required: false
        description: Filter tanggal (YYYY-MM-DD)
        schema:
          type: string
          format: date
      - $ref: '#/components/parameters/page'
      - $ref: '#/components/parameters/limit'
      responses:
        '200':
          description: Berhasil
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/ApiResponse'
                - type: object
                  properties:
                    data:
                      type: array
                      items:
                        $ref: '#/components/schemas/PengumpulanRingkas'
                    meta:
                      $ref: '#/components/schemas/Meta'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /pengumpulan-sampah/{id}/detail:
    post:
      tags:
      - 04 - Kumpul Sampah
      summary: Tambah jenis sampah pada setoran
      operationId: addDetailPengumpulan
      description: |-
        **Role:** Admin, Super Admin

        Menambahkan satu baris jenis sampah beserta berat hasil penimbangan. Server menghitung `nilai` = berat x tarif_jasa_pengelolaan yang berlaku saat itu, lalu menyimpannya sehingga perubahan tarif di kemudian hari tidak mengubah nilai lama. Hanya dapat dilakukan saat status `belum_dipilah`.
      parameters:
      - name: id
        in: path
        required: true
        description: ID pengumpulan sampah
        schema:
          type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DetailPengumpulanInput'
      responses:
        '201':
          description: Detail ditambahkan
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/ApiResponse'
                - type: object
                  properties:
                    data:
                      $ref: '#/components/schemas/TambahDetailData'
        '422':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /pengumpulan-sampah/{id}/detail/{id_detail}:
    delete:
      tags:
      - 04 - Kumpul Sampah
      summary: Hapus baris jenis sampah
      operationId: deleteDetailPengumpulan
      description: |-
        **Role:** Admin, Super Admin

        Menghapus satu baris detail sampah. Hanya dapat dilakukan saat status `belum_dipilah`.
      parameters:
      - name: id
        in: path
        required: true
        description: ID pengumpulan sampah
        schema:
          type: integer
      - name: id_detail
        in: path
        required: true
        description: ID detail pengumpulan sampah
        schema:
          type: integer
      responses:
        '200':
          description: Detail dihapus
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/ApiResponse'
                - type: object
                  properties:
                    data:
                      type: object
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /pengumpulan-sampah/{id}/selesai-pilah:
    patch:
      tags:
      - 04 - Kumpul Sampah
      summary: Tandai selesai pemilahan
      operationId: selesaiPilah
      description: |-
        **Role:** Admin, Super Admin

        Menandai seluruh jenis sampah pada setoran sudah dipilah dan ditimbang. Status berubah menjadi `menunggu_bayar` dan total biaya jasa dihitung.
      parameters:
      - name: id
        in: path
        required: true
        description: ID pengumpulan sampah
        schema:
          type: integer
      responses:
        '200':
          description: Berhasil
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/ApiResponse'
                - type: object
                  properties:
                    data:
                      $ref: '#/components/schemas/PengumpulanRingkas'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /pengumpulan-sampah/{id}:
    get:
      tags:
      - 05 - Status Setoran
      summary: Detail setoran
      operationId: getPengumpulan
      description: |-
        **Role:** Admin, Super Admin

        Detail setoran beserta seluruh baris jenis sampah yang sudah diinput.
      parameters:
      - name: id
        in: path
        required: true
        description: ID pengumpulan sampah
        schema:
          type: integer
      responses:
        '200':
          description: Berhasil
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/ApiResponse'
                - type: object
                  properties:
                    data:
                      $ref: '#/components/schemas/PengumpulanDetail'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /pengumpulan-sampah/{id}/nota:
    get:
      tags:
      - 06 - Pembayaran & Nota
      summary: Lihat nota setoran
      operationId: getNota
      description: |-
        **Role:** Admin, Super Admin

        Nota berisi detail sampah, berat, nilai, dan total biaya jasa. Nota tetap dapat diakses setelah setoran berstatus `selesai`.
      parameters:
      - name: id
        in: path
        required: true
        description: ID pengumpulan sampah
        schema:
          type: integer
      responses:
        '200':
          description: Berhasil
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/ApiResponse'
                - type: object
                  properties:
                    data:
                      $ref: '#/components/schemas/Nota'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /pengumpulan-sampah/{id}/pembayaran:
    post:
      tags:
      - 06 - Pembayaran & Nota
      summary: Tandai sudah lunas
      operationId: createPembayaran
      description: |-
        **Role:** Admin, Super Admin

        Mencatat pembayaran dan mengubah status setoran menjadi `selesai`. Hanya dapat dilakukan saat status `menunggu_bayar`.
      parameters:
      - name: id
        in: path
        required: true
        description: ID pengumpulan sampah
        schema:
          type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PembayaranInput'
      responses:
        '201':
          description: Pembayaran dicatat
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/ApiResponse'
                - type: object
                  properties:
                    data:
                      $ref: '#/components/schemas/Pembayaran'
        '422':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /pembayaran:
    get:
      tags:
      - 06 - Pembayaran & Nota
      summary: Riwayat pembayaran
      operationId: listPembayaran
      description: |-
        **Role:** Admin, Super Admin

        Daftar pembayaran yang telah dicatat.
      parameters:
      - name: tanggal
        in: query
        required: false
        description: Filter tanggal bayar (YYYY-MM-DD)
        schema:
          type: string
          format: date
      - $ref: '#/components/parameters/page'
      - $ref: '#/components/parameters/limit'
      responses:
        '200':
          description: Berhasil
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/ApiResponse'
                - type: object
                  properties:
                    data:
                      type: array
                      items:
                        $ref: '#/components/schemas/Pembayaran'
                    meta:
                      $ref: '#/components/schemas/Meta'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /warga:
    get:
      tags:
      - 07 - Data Warga
      summary: Daftar warga
      operationId: listWarga
      description: |-
        **Role:** Admin, Super Admin

        Daftar warga. Juga dipakai untuk mencari warga penyetor saat membuat setoran.
      parameters:
      - name: search
        in: query
        required: false
        description: Kata kunci nama warga
        schema:
          type: string
      - name: status
        in: query
        required: false
        description: Filter status warga
        schema:
          type: string
          enum:
          - aktif
          - nonaktif
      - $ref: '#/components/parameters/page'
      - $ref: '#/components/parameters/limit'
      responses:
        '200':
          description: Berhasil
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/ApiResponse'
                - type: object
                  properties:
                    data:
                      type: array
                      items:
                        $ref: '#/components/schemas/Warga'
                    meta:
                      $ref: '#/components/schemas/Meta'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      tags:
      - 07 - Data Warga
      summary: Tambah warga
      operationId: createWarga
      description: |-
        **Role:** Admin, Super Admin

        Menambahkan data warga beserta nomor WhatsApp.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WargaInput'
      responses:
        '201':
          description: Warga ditambahkan
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/ApiResponse'
                - type: object
                  properties:
                    data:
                      $ref: '#/components/schemas/Warga'
        '422':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /warga/{id}:
    get:
      tags:
      - 07 - Data Warga
      summary: Detail warga
      operationId: getWarga
      description: |-
        **Role:** Admin, Super Admin

        Detail satu warga.
      parameters:
      - name: id
        in: path
        required: true
        description: ID warga
        schema:
          type: integer
      responses:
        '200':
          description: Berhasil
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/ApiResponse'
                - type: object
                  properties:
                    data:
                      $ref: '#/components/schemas/Warga'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      tags:
      - 07 - Data Warga
      summary: Ubah data warga
      operationId: updateWarga
      description: |-
        **Role:** Admin, Super Admin

        Mengubah nama atau nomor WhatsApp warga.
      parameters:
      - name: id
        in: path
        required: true
        description: ID warga
        schema:
          type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WargaInput'
      responses:
        '200':
          description: Berhasil
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/ApiResponse'
                - type: object
                  properties:
                    data:
                      $ref: '#/components/schemas/Warga'
        '422':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags:
      - 07 - Data Warga
      summary: Nonaktifkan warga
      operationId: deleteWarga
      description: |-
        **Role:** Admin, Super Admin

        Menghapus/menonaktifkan warga (soft delete). Histori setoran warga tidak hilang.
      parameters:
      - name: id
        in: path
        required: true
        description: ID warga
        schema:
          type: integer
      responses:
        '200':
          description: Warga dinonaktifkan
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/ApiResponse'
                - type: object
                  properties:
                    data:
                      type: object
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /jenis-sampah:
    get:
      tags:
      - 08 - Tarif Jasa
      summary: Daftar jenis sampah dan tarif
      operationId: listJenisSampah
      description: |-
        **Role:** Admin, Super Admin

        Daftar jenis sampah beserta satuan massa dan tarif jasa pengelolaan. Dipakai juga sebagai pilihan dropdown saat menambah detail setoran.
      responses:
        '200':
          description: Berhasil
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/ApiResponse'
                - type: object
                  properties:
                    data:
                      type: array
                      items:
                        $ref: '#/components/schemas/JenisSampah'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
