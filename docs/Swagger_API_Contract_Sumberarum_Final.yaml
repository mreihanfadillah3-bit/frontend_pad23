        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      tags:
      - 14 - Admin & Audit
      summary: Tambah admin
      operationId: createAdmin
      description: |-
        **Role:** Super Admin

        Menambahkan akun Admin baru.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminCreate'
      responses:
        '201':
          description: Admin ditambahkan
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/ApiResponse'
                - type: object
                  properties:
                    data:
                      $ref: '#/components/schemas/Admin'
        '422':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /admin/{id}:
    delete:
      tags:
      - 14 - Admin & Audit
      summary: Hapus admin
      operationId: deleteAdmin
      description: |-
        **Role:** Super Admin

        Menghapus akun Admin.
      parameters:
      - name: id
        in: path
        required: true
        description: ID admin
        schema:
          type: integer
      responses:
        '200':
          description: Admin dihapus
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/ApiResponse'
                - type: object
                  properties:
                    data:
                      type: object
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /audit-log:
    get:
      tags:
      - 14 - Admin & Audit
      summary: Riwayat aktivitas admin
      operationId: listAuditLog
      description: |-
        **Role:** Super Admin

        Histori perubahan data penting: aksi, entitas, data lama, data baru, ID Admin pelaku, dan waktu perubahan.
      parameters:
      - name: id_admin
        in: query
        required: false
        description: Filter admin pelaku
        schema:
          type: integer
      - name: entitas
        in: query
        required: false
        description: Filter entitas yang diubah
        schema:
          type: string
      - name: tanggal
        in: query
        required: false
        description: Filter tanggal (YYYY-MM-DD)
        schema:
          type: string
          format: date
      - $ref: '#/components/parameters/page'
      - $ref: '#/components/parameters/limit'
      responses:
        '200':
          description: Berhasil
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/ApiResponse'
                - type: object
                  properties:
                    data:
                      type: array
                      items:
                        $ref: '#/components/schemas/AuditLog'
                    meta:
                      $ref: '#/components/schemas/Meta'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    page:
      name: page
      in: query
      description: Nomor halaman
      schema:
        type: integer
        minimum: 1
        default: 1
    limit:
      name: limit
      in: query
      description: Jumlah data per halaman
      schema:
        type: integer
        minimum: 1
        maximum: 10
        default: 10
  responses:
    Unauthorized:
      description: Token tidak ada atau tidak valid
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            status: error
            message: Token tidak ada atau tidak valid
    Forbidden:
      description: Role tidak memiliki akses ke endpoint ini
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            status: error
            message: Role tidak memiliki akses ke endpoint ini
    NotFound:
      description: Data tidak ditemukan
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            status: error
            message: Data tidak ditemukan
    ValidationError:
      description: Validasi data gagal. Key pada errors menyesuaikan nama field yang gagal divalidasi.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            status: error
            message: Validasi gagal
            errors:
              password:
                - Password wajib diisi.
  schemas:
    ApiResponse:
      type: object
      properties:
        status:
          type: string
          enum:
          - success
        message:
          type: string
    ErrorResponse:
      type: object
      description: >-
        Format respons error. Properti errors bersifat opsional dan menggunakan nama field
        yang benar-benar gagal divalidasi sebagai key dinamis (misalnya username, password,
        id_warga, atau id_program). Nama additionalProp1/additionalProp2 yang mungkin
        ditampilkan Swagger hanyalah placeholder otomatis, bukan key literal yang dikirim API.
      properties:
        status:
          type: string
          enum:
          - error
          example: error
        message:
          type: string
          example: Validasi gagal
        errors:
          type: object
          description: Rincian kesalahan validasi per field; dapat tidak disertakan untuk error non-validasi.
          additionalProperties:
            type: array
            items:
              type: string
          example:
            password:
              - Password wajib diisi.
      example:
        status: error
        message: Validasi gagal
        errors:
          password:
            - Password wajib diisi.
    Meta:
      type: object
      description: Metadata pagination untuk response daftar. page dimulai dari 1; limit default dan maksimum 10.
      properties:
        page:
          type: integer
        limit:
          type: integer
        total_data:
          type: integer
        total_page:
          type: integer
    LoginRequest:
      type: object
      properties:
        username:
          type: string
        password:
          type: string
